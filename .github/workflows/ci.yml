name: CI

# Run on every push and on every pull request targeting main branches.
# This workflow enforces: type-checking, linting, and tests.
# It must pass before a branch can be merged.

on:
  push:
    branches:
      - "**"
    # Skip the CI run on release tags — the release workflow handles those
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  ci:
    name: Type-check · Lint · Test
    # Use ubuntu for speed; Electron packaging is Windows-only but tests are
    # platform-agnostic because all Electron/OS APIs are mocked.
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # TypeScript — catch type errors before running tests
      - name: Type-check
        run: npx tsc -b --noEmit

      # -----------------------------------------------------------------------
      # ESLint — enforce code-quality standards
      - name: Lint
        run: npm run lint

      # -----------------------------------------------------------------------
      # Vitest — run the full test suite (single run, not watch mode)
      - name: Test
        run: npm test -- --run

      # -----------------------------------------------------------------------
      # Upload coverage report as an artifact for review on failed PRs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
